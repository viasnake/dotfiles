# https://alacritty.org/config-alacritty.html
[general]
import = ["rose-pine.toml"]

[font.normal]
family = "Firge35Nerd Console"

# Load the login environment before recording the interactive Fish session.
# Bash expands HOME; no machine-specific configuration generation is needed.
[terminal.shell]
program = "/bin/bash"
args = ["-lc", 'exec "$HOME/.local/bin/termlog" run -- fish']
